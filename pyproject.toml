[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cglc-worker"
version = "0.1.0"
description = "Contract-Gated Lease Controller (CGLC) worker -- Adaptive Research Depth V1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "anthropic>=1.0", "flask>=3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=1.0"]
embed = ["fastembed>=0.3"]  # optional dense retrieval; core stays stdlib-only

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
